<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>عُذْرًا يا جَدِّي | الفهم والاستيعاب</title>
<style>
*{box-sizing:border-box}
:root{
  --navy:#27496d; --mint:#dff5ea; --pink:#f8dce8; --yellow:#fff0bf; --lav:#e8dcfa;
  --blue:#dceeff; --cream:#fffaf1; --ok:#2f9a69; --bad:#c94c5d;
}
body{
  margin:0;font-family:Tahoma,Arial,sans-serif;
  background:linear-gradient(180deg,#f7f2ff 0%,#fffaf6 100%);color:var(--navy);
}
.page{max-width:1180px;margin:auto;padding:22px}
.top{
  background:linear-gradient(135deg,#e9ddfb,#dff4ff 45%,#ffe5ef);
  border:3px solid #fff;border-radius:34px;box-shadow:0 14px 35px #6d5c8f20;
  padding:22px 26px;position:relative;overflow:hidden;text-align:center
}
.top:before,.top:after{
  content:"";position:absolute;border-radius:50%;filter:blur(.3px);opacity:.65
}
.top:before{width:160px;height:160px;background:#fff3b8;right:-40px;top:-70px}
.top:after{width:190px;height:190px;background:#ffd8e5;left:-60px;bottom:-100px}
.badge{
  display:inline-flex;align-items:center;gap:12px;background:#fffdf8;border:3px solid #fff;
  border-radius:24px;padding:10px 22px;box-shadow:0 8px 22px #6d5c8f22;font-size:30px;font-weight:800
}
.sub{font-size:18px;margin-top:8px;color:#64738a}
.card{
  margin-top:22px;background:white;border-radius:30px;padding:28px;box-shadow:0 14px 35px #6d5c8f18;
  border:1px solid #eadff4
}
.progress-wrap{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.progress{height:15px;background:#edf1f6;border-radius:999px;overflow:hidden;flex:1}
.bar{height:100%;width:0;background:linear-gradient(90deg,#86d3b6,#7ab8ee);transition:.35s}
.counter{font-weight:800;white-space:nowrap}
.qbox{text-align:center;padding:12px 10px 18px}
.qnum{font-size:17px;color:#7a6a91;margin-bottom:8px}
.question{font-size:32px;font-weight:800;line-height:1.55}
.options{display:grid;grid-template-columns:1fr;gap:14px;max-width:850px;margin:6px auto}
.opt{
  border:2px solid #e6deef;background:#fff;border-radius:20px;padding:17px 20px;font-size:23px;
  color:#304866;cursor:pointer;transition:.18s;box-shadow:0 5px 14px #675a8210
}
.opt:hover{transform:translateY(-2px);border-color:#b9a8dc}
.opt.correct{background:#e6f7ee;border-color:#7ac59e;color:#236d4e}
.opt.wrong{background:#fff0f2;border-color:#df94a0;color:#993847}
.opt:disabled{cursor:default}
.feedback{min-height:52px;text-align:center;font-size:22px;font-weight:800;margin-top:14px}
.next{
  display:none;margin:12px auto 0;border:0;border-radius:18px;padding:13px 24px;font-size:20px;
  background:#6f77d8;color:white;cursor:pointer;box-shadow:0 7px 18px #6f77d833
}
.finish{display:none;text-align:center;padding:20px}
.finish h2{font-size:38px;margin:8px 0}
.score{font-size:52px;font-weight:900;color:#398c70}
.finish p{font-size:22px}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.actions button{border:0;border-radius:16px;padding:12px 20px;font-size:18px;cursor:pointer}
.again{background:#ffe1eb;color:#81465a} .home{background:#e5f1ff;color:#365d83}
.note{margin-top:18px;text-align:center;color:#7c728c;font-size:14px}
@media(max-width:700px){
  .page{padding:10px} .card{padding:18px 13px;border-radius:22px}
  .badge{font-size:24px} .question{font-size:25px} .opt{font-size:19px;padding:15px}
}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="badge">🧠 الفهم والاستيعاب</div>
    <div class="sub">اقرأ السؤال ثم اختر الإجابة الصحيحة</div>
  </header>

  <main class="card">
    <div id="quiz">
      <div class="progress-wrap">
        <div class="counter" id="counter">1 / 8</div>
        <div class="progress"><div class="bar" id="bar"></div></div>
      </div>
      <div class="qbox">
        <div class="qnum" id="qnum"></div>
        <div class="question" id="question"></div>
      </div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next" id="next">السؤال التالي ←</button>
    </div>

    <div class="finish" id="finish">
      <div style="font-size:64px">👏</div>
      <h2>أحسنت!</h2>
      <div class="score" id="score"></div>
      <p>أكملت أسئلة الفهم والاستيعاب.</p>
      <div class="actions">
        <button class="again" onclick="restartQuiz()">إعادة الأسئلة</button>
        <button class="home" onclick="history.back()">⌂ الرئيسية</button>
      </div>
    </div>
  </main>
  <div class="note">المؤثرات الصوتية تشجيعية فقط، بدون موسيقى.</div>
</div>

<audio id="correctSound" src="kids-cheering.mp3" preload="auto"></audio>
<audio id="wrongSound" src="wrong.wav" preload="auto"></audio>
<audio id="finishSound" src="kids-cheering.mp3" preload="auto"></audio>

<script>
const questions = [{"q": "إلى أين اصطحب المعلم التلاميذ؟", "opts": ["إلى مكتبة المدرسة", "إلى ساحة المدرسة", "إلى غرفة المعلمين"], "ans": 0}, {"q": "كيف جلس فواز في المكتبة؟", "opts": ["غاضبًا", "حزينًا", "نائمًا"], "ans": 1}, {"q": "ما الخطأ الذي ارتكبه فواز في حق جده؟", "opts": ["لم يخفض صوت التلفاز عندما طلب منه جده", "ترك كتبه في المكتبة", "تأخر عن المدرسة"], "ans": 0}, {"q": "بِمَ نصح المعلم فوازًا؟", "opts": ["أن يتجاهل الأمر", "أن يعتذر إلى جده ويطلب السماح", "أن يرفع صوت التلفاز"], "ans": 1}, {"q": "لماذا لم يفعل فواز ما طلبه جده منه؟", "opts": ["لأنه لم يسمع جده", "لانشغاله بمتابعة برنامجه المفضل", "لأنه كان يقرأ كتابًا"], "ans": 1}, {"q": "ما رأيك في تصرف فواز؟", "opts": ["تصرف صحيح", "تصرف غير صحيح، وكان عليه طاعة جده", "لا فرق بين الأمرين"], "ans": 1}, {"q": "ماذا تعلمت من النص؟", "opts": ["أهمية طاعة الجد والاعتذار عند الخطأ", "أن نشاهد التلفاز بصوت مرتفع", "أن نتجاهل نصيحة الكبار"], "ans": 0}, {"q": "ما الصفات المشتركة بين الأب والجد؟", "opts": ["العطف والحنان", "القسوة والغضب", "الإهمال وعدم الاهتمام"], "ans": 0}];
let i=0, score=0, locked=false;

const qEl=document.getElementById('question');
const optsEl=document.getElementById('options');
const fb=document.getElementById('feedback');
const counter=document.getElementById('counter');
const qnum=document.getElementById('qnum');
const bar=document.getElementById('bar');
const next=document.getElementById('next');
const correctSound=document.getElementById('correctSound');
const wrongSound=document.getElementById('wrongSound');
const finishSound=document.getElementById('finishSound');

function playSound(a){
  a.currentTime=0;
  a.play().catch(()=>{});
}

function render(){
  locked=false;
  const q=questions[i];
  counter.textContent=(i+1)+' / '+questions.length;
  qnum.textContent='السؤال '+(i+1)+' من '+questions.length;
  bar.style.width=(i/questions.length*100)+'%';
  qEl.textContent=q.q;
  optsEl.innerHTML='';
  fb.textContent='';
  fb.style.color='';
  next.style.display='none';
  q.opts.forEach((text,idx)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.textContent=text;
    b.onclick=()=>answer(idx,b);
    optsEl.appendChild(b);
  });
}

function answer(idx,btn){
  if(locked) return;
  const q=questions[i];
  if(idx===q.ans){
    locked=true;
    score++;
    btn.classList.add('correct');
    [...optsEl.children].forEach(x=>x.disabled=true);
    fb.textContent='أحسنت! إجابة صحيحة 👏';
    fb.style.color='#2f8a63';
    playSound(correctSound);
    next.style.display='block';
  } else {
    btn.classList.add('wrong');
    btn.disabled=true;
    fb.textContent='حاول مرة أخرى 🌷';
    fb.style.color='#b04859';
    playSound(wrongSound);
  }
}

next.onclick=()=>{
  i++;
  if(i<questions.length) render();
  else finishQuiz();
};

function finishQuiz(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('finish').style.display='block';
  document.getElementById('score').textContent=score+' / '+questions.length;
  bar.style.width='100%';
  playSound(finishSound);
}

function restartQuiz(){
  i=0;score=0;
  document.getElementById('quiz').style.display='block';
  document.getElementById('finish').style.display='none';
  render();
}
render();
</script>
</body></html>
